<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ooo.oliyo.com - 神秘玄学博客</title>
  <meta name="description" content="探索宇宙奥秘，解读生命密码 - 基于Fresh框架的神秘学博客">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="min-h-screen bg-background-DEFAULT">
    <!-- 神秘学主题加载动画 -->
    <div class="flex flex-col items-center justify-center min-h-screen p-4">
      <div class="relative w-24 h-24 mb-6">
        <div class="absolute inset-0 rounded-full bg-gradient-to-r from-primary-600 to-mysticGold opacity-20 animate-pulse-slow"></div>
        <div class="relative w-full h-full rounded-full border-4 border-primary-500/30 border-t-mysticGold animate-spin-slow"></div>
        <div class="absolute inset-0 flex items-center justify-center text-mysticGold">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" class="animate-pulse-slow">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
        </div>
      </div>
      
      <h1 class="text-3xl font-bold mb-2 text-gradient">ooo.oliyo.com</h1>
      <p class="text-text mb-8 max-w-md text-center">探索宇宙奥秘，解读生命密码</p>
      
      <div class="mystic-card p-8 max-w-md w-full">
        <div class="flex items-center justify-center space-x-4 mb-6">
          <div class="w-3 h-3 rounded-full bg-primary-400 animate-pulse"></div>
          <div class="w-3 h-3 rounded-full bg-mysticGold animate-pulse delay-150"></div>
          <div class="w-3 h-3 rounded-full bg-primary-600 animate-pulse delay-300"></div>
        </div>
        
        <p class="text-text-light text-center font-medium">正在连接宇宙能量场...</p>
        <p class="text-text text-center text-sm mt-2">加载神秘学知识库，请稍候</p>
        
        <div class="mt-8 h-2 w-full bg-background-200 rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r from-primary-500 to-mysticGold animate-pulse-slow" style="width: 65%"></div>
        </div>
      </div>
      
      <!-- 背景装饰元素 -->
      <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary-500/10 rounded-full filter blur-3xl animate-float"></div>
        <div class="absolute bottom-1/4 right-1/4 w-48 h-48 bg-mysticGold/10 rounded-full filter blur-3xl animate-float" style="animation-delay: -3s;"></div>
        <div class="absolute top-1/2 left-1/3 w-96 h-96 bg-primary-600/5 rounded-full filter blur-3xl animate-pulse-slow"></div>
      </div>
    </div>
    
    <style>
      @keyframes spin-slow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .animate-spin-slow {
        animation: spin-slow 4s linear infinite;
      }
      
      /* 神秘学滚动条样式 */
      ::-webkit-scrollbar {
        width: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: background-200;
      }
      
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, primary-500, mysticGold);
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(to bottom, primary-600, mysticGold-200);
      }
    </style>
  </div>

  <!-- Fresh 应用的脚本和资源将由构建过程注入 -->
</body>
</html>

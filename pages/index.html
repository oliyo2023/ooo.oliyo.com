<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ooo.oliyo.com - Fresh Blog</title>
  <meta name="description" content="基于 Fresh 框架的现代化博客系统">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <!-- Fresh 应用将在这里渲染 -->
    <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f3f4f6;">
      <div style="text-align: center; padding: 2rem;">
        <div style="width: 50px; height: 50px; border: 4px solid #e5e7eb; border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
        <p style="color: #6b7280; font-family: system-ui, -apple-system, sans-serif;">正在加载 Fresh Blog...</p>
      </div>
    </div>

    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </div>

  <!-- Fresh 应用的脚本和资源将由构建过程注入 -->
</body>
</html>
